name: CodeQL

on:
  push: # All branches (this repo hosts the whole template-branch family)
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Weekly, Monday 06:00 UTC

# Cancel superseded runs, but only for pull requests so push / scheduled scans always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      # Code scanning is free on public repos but needs a GitHub Code Security license on
      # private ones (this template family includes private forks). Probing the code-scanning
      # API up front lets the analyze step skip the SARIF upload instead of failing the run.
      # An event-payload check (github.event.repository.private) would not work here: the
      # payload has no repository data on scheduled runs.
      - name: Check whether code scanning upload is available
        id: code-scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/code-scanning/analyses?per_page=1" --silent; then
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: ${{ steps.code-scanning.outputs.enabled == 'true' && 'always' || 'never' }}
          upload-database: ${{ steps.code-scanning.outputs.enabled == 'true' }}

      # Without the code-scanning upload the findings would only exist in the job log, so
      # keep them inspectable by archiving the SARIF output as a workflow artifact.
      - name: Archive SARIF results (code scanning upload unavailable)
        if: steps.code-scanning.outputs.enabled != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: sarif-results
