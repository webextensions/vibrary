# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # package.json is generated from package.json.ts (see the pkg-json-sync health check) - only
    # refresh package-lock.json within the existing ranges, never edit the manifest. Out-of-range /
    # major bumps stay manual via "node --run housekeeping:update-and-generate-package-json".
    versioning-strategy: lockfile-only

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
